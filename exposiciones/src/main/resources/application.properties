spring.application.name=ms-exposiciones
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/ms_exposiciones
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
